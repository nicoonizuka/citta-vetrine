<title>Città delle Vetrine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pixelify+Sans:wght@700&display=swap">
<style>
/* Layout: schermo di gioco cartoon. A sinistra cornice scura con barra HUD + mappa pixel art, a destra schede verticali a icone + pannello azzurro con card */
:root{
  --page:#d7e7ee; --page-ink:#2d2433; --page-muted:#5a6676;
  --o:#2d2433; --frame:#22303f; --sky:#5ec8f2; --sky2:#9ee0fa; --card:#ffffff; --soft:#eef7fb;
  --green:#6fd14f; --greend:#3f9a2f; --yellow:#ffd447; --yellowd:#d99a1e; --red:#f2552f; --pink:#ff7eb3; --blue:#4fb3f2; --violet:#9b6bea;
  --grey:#c3ccd4; --txt:#2d2433; --txt2:#5d5672;
  --ui:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif; --pix:"Pixelify Sans",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#121820;--page-ink:#e8eef3;--page-muted:#9aa8b6;color-scheme:dark}}
:root[data-theme="dark"]{--page:#121820;--page-ink:#e8eef3;--page-muted:#9aa8b6;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--page-ink);font-family:var(--ui);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--pix);font-size:clamp(24px,4vw,34px);margin:0;line-height:1}
.game{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px;align-items:start}
@media (max-width:980px){.game{grid-template-columns:1fr}}

.stagebox{background:var(--frame);border:3px solid var(--o);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 var(--o);min-width:0}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--txt);border:2.5px solid var(--o);border-radius:11px;padding:3px 10px 3px 5px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--o);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip img{width:26px;height:26px}
.chip small{font-weight:600;font-size:12px;color:var(--txt2)}
.trendbox{flex:1 1 260px;background:var(--card);color:var(--txt);border:2.5px solid var(--o);border-radius:12px;box-shadow:0 3px 0 var(--o);padding:6px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;min-width:0}
.trendbox img{width:30px;height:30px;grid-row:1/3}
.trendbox .tt{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trendbox .tt b{color:var(--red)}
.trendbox .cold{font-size:13px;color:var(--txt2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trendbox .timer{grid-row:1/3;grid-column:3;font-weight:700;font-size:13px;color:var(--txt2);text-align:right}
.tbar{grid-column:1/4;height:12px;border:2px solid var(--o);border-radius:99px;background:#f3dfd9;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--red);border-right:2px solid var(--o)}
.rumor{grid-column:1/4;font-size:12px;font-weight:600;color:var(--txt2);min-height:1.2em}

.mapwrap{position:relative;margin:0 auto;line-height:0;max-width:100%}
#map{display:block;border-radius:8px;cursor:pointer;max-width:100%}
.lock{position:absolute;transform:translate(-50%,-50%);background:var(--card);color:var(--txt);border:2.5px solid var(--o);border-radius:12px;box-shadow:0 3px 0 var(--o);padding:5px 10px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1;cursor:pointer;font-family:var(--ui)}
.lock img{width:24px;height:24px}
.lock .nm{font-weight:700;font-size:13px;white-space:nowrap}
.lock .pr{font-weight:700;font-size:13px;background:var(--grey);color:#fff;border:2px solid var(--o);border-radius:8px;padding:1px 8px;text-shadow:0 1px 0 var(--o)}
.lock.can .pr{background:var(--green)}
@media (max-width:620px){.lock .nm{display:none}.lock{padding:4px 7px 5px}}
.toast{position:absolute;left:10px;bottom:10px;max-width:min(78%,420px);background:var(--card);color:var(--txt);border:2.5px solid var(--o);border-radius:11px;box-shadow:0 3px 0 var(--o);padding:6px 10px 6px 6px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;line-height:1.25;transition:opacity .3s,transform .3s;pointer-events:none}
.toast img{width:24px;height:24px;flex:none}
.toast.off{opacity:0;transform:translateY(8px)}

.side{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:9px;padding-top:8px}
.tab{position:relative;width:70px;height:68px;border:3px solid var(--o);border-radius:15px;background:var(--c);box-shadow:0 4px 0 var(--o);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:11px;color:#fff;text-shadow:0 1px 0 var(--o),1px 0 0 var(--o),-1px 0 0 var(--o),0 -1px 0 var(--o);padding:0;transition:transform .12s}
.tab img{width:34px;height:34px}
.tab[aria-selected="true"]{transform:translateX(7px);box-shadow:0 4px 0 var(--o),inset 0 0 0 3px rgba(255,255,255,.75)}
.tab .dot{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:99px;background:var(--red);border:2px solid var(--o);font-size:11px;display:grid;place-items:center;padding:0 4px}
@media (max-width:980px){.side{grid-template-columns:1fr}.tabs{flex-direction:row;padding-top:0}.tab{flex:1;width:auto;height:58px}.tab[aria-selected="true"]{transform:translateY(-5px)}}
.sheet{background:var(--sky);border:3px solid var(--o);border-radius:18px;box-shadow:0 5px 0 var(--o);display:flex;flex-direction:column;min-width:0;max-height:min(720px,calc(100vh - 40px));overflow:hidden}
@media (max-width:980px){.sheet{max-height:none}}
.sheet .head{background:var(--sky2);border-bottom:3px solid var(--o);padding:10px 12px;display:flex;flex-direction:column;gap:8px;color:var(--txt)}
.sheet .title{font-weight:700;font-size:23px;text-align:center;line-height:1}
.sheet .sub{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.mini{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--txt);background:var(--card);border:2px solid var(--o);border-radius:8px;padding:1px 7px 1px 3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini img{width:18px;height:18px}
.mini.hot{background:#ffe3d6;color:#b8361c}.mini.cold{background:#dcefff;color:#2c78c2}
.seg{display:inline-flex;border:2px solid var(--o);border-radius:9px;overflow:hidden;box-shadow:0 2px 0 var(--o)}
.seg button{border:0;border-right:2px solid var(--o);background:var(--card);color:var(--txt);font-family:var(--ui);font-weight:700;font-size:13px;padding:3px 10px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--yellow)}
.list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:120px}
.card{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:3px 10px;align-items:center;background:var(--card);color:var(--txt);border:2.5px solid var(--o);border-radius:13px;padding:8px;box-shadow:0 3px 0 rgba(45,36,51,.55)}
.card.click{cursor:pointer}
.card.flash{animation:flash 1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 5px var(--yellow)}100%{box-shadow:0 3px 0 rgba(45,36,51,.55)}}
.card .ico{grid-row:1/4;width:58px;height:58px;border-radius:11px;border:2.5px solid var(--o);display:grid;place-items:center;background:var(--bgc,#eee)}
.card .ico img{width:40px;height:40px}
.card .nm{font-weight:700;font-size:16px;line-height:1.1;display:flex;align-items:center;gap:6px;min-width:0}
.card .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .stars{display:inline-flex;gap:1px;flex:none}.card .stars img{width:14px;height:14px}
.card .row{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.card .tx{font-size:12px;font-weight:600;color:var(--txt2)}
.prog{position:relative;height:16px;border:2px solid var(--o);border-radius:99px;background:#e2ebf0;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--yellow);border-right:2px solid var(--o)}
.prog span{position:relative;display:block;text-align:center;font-weight:700;font-size:11px;line-height:12px;color:var(--txt)}
.buy{grid-row:1/4;grid-column:3;min-width:104px;background:var(--green);border:2.5px solid var(--o);border-radius:11px;box-shadow:0 3px 0 var(--greend),0 3px 0 1px var(--o);color:#fff;font-family:var(--ui);font-weight:700;font-size:16px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;text-shadow:0 1px 0 var(--o),1px 0 0 var(--o),-1px 0 0 var(--o),0 -1px 0 var(--o);line-height:1.15;font-variant-numeric:tabular-nums}
.buy small{font-size:12px;font-weight:600}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--greend),0 1px 0 1px var(--o)}
.buy:disabled{background:var(--grey);box-shadow:0 3px 0 #97a1ab,0 3px 0 1px var(--o);cursor:not-allowed}
.buy.yellow{background:var(--yellow);box-shadow:0 3px 0 var(--yellowd),0 3px 0 1px var(--o)}
.done{grid-row:1/4;grid-column:3;font-weight:700;font-size:14px;color:var(--greend);padding:0 8px}
.empty{background:var(--card);color:var(--txt);border:2.5px dashed var(--o);border-radius:13px;padding:14px;font-weight:600;text-align:center}
.bigtrend{background:var(--card);color:var(--txt);border:2.5px solid var(--o);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 rgba(45,36,51,.55)}
.bigtrend .l{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.bigtrend .l img{width:40px;height:40px}
.bigtrend p{margin:0;font-size:13px;font-weight:500;color:var(--txt2)}
button:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}

.below{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.news{font-size:13px;color:var(--page-muted);display:flex;flex-direction:column;gap:2px;font-weight:500}
.news div:first-child{color:var(--page-ink)}
.below button{background:none;border:0;color:var(--page-muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
@media (prefers-reduced-motion:reduce){.tab,.toast{transition:none}.card.flash{animation:none}}
</style>

<div class="wrap">
  <h1>Città delle Vetrine</h1>
  <div class="game">
    <div class="stagebox">
      <div class="hud">
        <div class="chips">
          <div class="chip" title="Soldi in cassa"><img class="px" data-ico="coin" alt=""><span id="money">€ 0</span></div>
          <div class="chip" title="Guadagno al secondo"><img class="px" data-ico="up" alt=""><span id="rate">€ 0</span><small>/s</small></div>
          <div class="chip" title="Negozi aperti"><img class="px" data-ico="store" alt=""><span id="count">0</span><small>/12</small></div>
          <div class="chip" title="Bonus varietà"><img class="px" data-ico="star" alt=""><span id="variety">×1</span></div>
        </div>
        <div class="trendbox" aria-live="polite">
          <img class="px" data-ico="fire" alt="">
          <div class="tt">Di moda: <b id="hot">—</b></div>
          <div class="timer" id="tleft"></div>
          <div class="cold" id="cold"></div>
          <div class="tbar"><i id="tbar"></i></div>
          <div class="rumor" id="rumor"></div>
        </div>
      </div>
      <div class="mapwrap" id="mapwrap">
        <canvas id="map" width="384" height="256" aria-label="Mappa della città: tocca un lotto o un negozio"></canvas>
        <div id="locks"></div>
        <div class="toast off" id="toast"><img class="px" data-ico="star" alt="" id="toastIco"><span id="toastTxt"></span></div>
      </div>
    </div>

    <div class="side">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="negozi" style="--c:var(--pink)"><img class="px" data-ico="store" alt="">Negozi</button>
        <button class="tab" role="tab" data-tab="apri" style="--c:var(--green)"><img class="px" data-ico="plus" alt="">Apri<span class="dot" id="dotApri" hidden>!</span></button>
        <button class="tab" role="tab" data-tab="quartieri" style="--c:var(--blue)"><img class="px" data-ico="map" alt="">Quartieri<span class="dot" id="dotQ" hidden>!</span></button>
        <button class="tab" role="tab" data-tab="mode" style="--c:var(--yellow)"><img class="px" data-ico="fire" alt="">Mode</button>
      </div>
      <div class="sheet">
        <div class="head" id="head"></div>
        <div class="list" id="list"></div>
      </div>
    </div>
  </div>

  <div class="below">
    <div class="news" id="news"></div>
    <button id="resetBtn" type="button">Cancella partita</button>
  </div>
</div>

function trendPool(){const hi=Math.max(1,...shops().map(s=>s.t+1));return [...Array(Math.min(TYPES.length,hi+1)).keys()];}
function rollNext(){const pool=trendPool();let opts=pool.filter(t=>t!==S.trend.hot);if(!opts.length)opts=pool;
  const hot=opts[Math.floor(Math.random()*opts.length)];
  const owned=[...new Set(shops().map(s=>s.t))].filter(t=>t!==hot);
  const cold=owned.length&&Math.random()<.85?owned[Math.floor(Math.random()*owned.length)]:-1;
  return{hot,cold};}
function updateTrend(dt){
  const tr=S.trend;tr.left-=dt;
  if(tr.left<=25&&!tr.next){tr.next=rollNext();const pool=trendPool().filter(t=>t!==tr.next.hot);
    tr.rumor=(Math.random()<.7||!pool.length)?tr.next.hot:pool[Math.floor(Math.random()*pool.length)];}
  if(tr.left<=0){const n=tr.next||rollNext();S.hist.unshift({hot:tr.hot,cold:tr.cold});S.hist=S.hist.slice(0,5);
    tr.hot=n.hot;tr.cold=n.cold;tr.left=TREND_LEN;tr.next=null;tr.rumor=null;
    news(`Nuova moda: ${TYPES[n.hot].name} ×3`+(n.cold>=0?` · in calo ${TYPES[n.cold].name}`:""),"fire");}
}

  $("tbar").style.width=(Math.max(0,tr.left)/TREND_LEN*100)+"%";
  $("rumor").textContent=tr.rumor!=null?`Voci: la prossima moda potrebbe essere ${TYPES[tr.rumor].name}…`:"";
  $("dotApri").hidden=!(targetLot()>=0&&TYPES.some((T,t)=>S.money>=openCost(t)&&T.cost<=Math.max(S.best,S.money)*3+30));
  $("dotQ").hidden=!DISTRICTS.some((d,k)=>!S.dist[k]&&S.money>=d.cost);
  upd.forEach(f=>f());
}

let resetArm=false;
$("resetBtn").onclick=()=>{if(!resetArm){resetArm=true;$("resetBtn").textContent="Sicuro? Clicca di nuovo";setTimeout(()=>{resetArm=false;$("resetBtn").textContent="Cancella partita"},3000);return;}
  S=fresh();resetArm=false;$("resetBtn").textContent="Cancella partita";peds=[];sel=null;bgDirty=true;$("news").innerHTML="";news("Partita nuova: hai € 20 e un centro storico tutto da riempire.","coin");setTab("apri");save();};

/* ======================= SALVATAGGIO & LOOP ======================= */
const KEY="citta-vetrine-v1";
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function offline(){const away=Math.min((Date.now()-S.last)/1000,7200);if(away>30&&rate()>0){const g2=rate()*away*.5;earn(g2);news(`Mentre eri via i negozi hanno incassato ${fmt(g2)}`,"coin");}}
function load(data){let d=data&&data.state;
  if(!d){try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}}
  if(d){S=Object.assign(fresh(),d);if(!S.hist)S.hist=[];offline();}
  else{news("Benvenuto! Hai € 20: apri il tuo primo negozio nel centro storico.","coin");tab="apri";}}
function fit(){const box=$("mapwrap").parentElement;const avail=box.clientWidth-20;const dpr=window.devicePixelRatio||1;
  K=Math.max(2,Math.round(avail*dpr/W));let css=Math.min(avail,W*K/dpr);
  cv.width=W*K;cv.height=H*K;bg.width=W*K;bg.height=H*K;cv.style.width=css+"px";cv.style.height=(css*H/W)+"px";$("mapwrap").style.width=css+"px";bgDirty=true;}
addEventListener("resize",fit);

let lastT=performance.now(),acc=0,sAcc=0;
function tick(t){const dt=Math.min((t-lastT)/1000,.1);lastT=t;
  earn(rate()*dt);S.best=Math.max(S.best,S.money);updateTrend(dt);updateWorld(dt);drawWorld();
  acc+=dt;sAcc+=dt;if(acc>.1){acc=0;render();}if(sAcc>5){sAcc=0;save();}
  requestAnimationFrame(tick);}
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();else offline();});

function start(data){load(data);initCars();for(let k=0;k<6;k++){const p=spawnPed(false);p.x=Math.random()*W;p.target=undefined;}
  fit();render();requestAnimationFrame(tick);
  if(document.fonts)document.fonts.ready.then(()=>{bgDirty=true;lastKey="";});}
window.claude?.hot?.snapshot?.(()=>({state:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
